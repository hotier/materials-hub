<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 产出导航站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-page-card">
    <div class="login-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h2>登录产出导航站</h2>
    <p class="login-subtitle">请输入访问密码</p>
    <div class="login-field">
      <input type="password" id="loginPassword" class="login-input" placeholder="输入密码" autocomplete="current-password">
      <button type="button" class="pwd-toggle" id="loginPwdToggle" title="显示密码">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="login-error" id="loginError" style="display:none;"></div>
    <button class="login-btn" id="loginSubmit">登 录</button>
    <p class="login-footer"><a href="/">返回首页</a></p>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
  (function () {
    'use strict';

    const $ = (sel) => document.querySelector(sel);

    function showToast(msg, type) {
      var c = $('#toastContainer');
      if (!c) return;
      var el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(function () {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(function () { el.remove(); }, 300);
      }, 3000);
    }

    var params = new URLSearchParams(location.search);
    var redirect = params.get('redirect') || '/';
    var isLogout = params.get('logout') === '1';

    // 退出登录后直接显示表单，不做自动登录检测
    if (!isLogout) {
      (async function tryAutoLogin() {
        try {
          var resp = await fetch('/api/auth-status');
          var data = await resp.json();
          if (!data.requireAuth) {
            location.replace(redirect);
            return;
          }
          var sessionResp = await fetch('/api/session');
          if (sessionResp.ok) {
            location.replace(redirect);
            return;
          }
        } catch (e) { /* 继续显示登录表单 */ }
      })();
    }

    // 显示/隐藏密码
    var pwdToggle = $('#loginPwdToggle');
    pwdToggle.addEventListener('click', function () {
      var isPass = loginInput.type === 'password';
      loginInput.type = isPass ? 'text' : 'password';
      pwdToggle.innerHTML = isPass
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      loginInput.focus();
    });
    var loginInput = $('#loginPassword');
    var loginBtn = $('#loginSubmit');
    var loginErr = $('#loginError');

    loginBtn.addEventListener('click', async function () {
      var pwd = loginInput.value.trim();
      if (!pwd) {
        loginErr.textContent = '请输入密码';
        loginErr.style.display = '';
        return;
      }
      loginBtn.disabled = true;
      loginBtn.textContent = '验证中...';
      loginErr.style.display = 'none';

      try {
        var resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        });
        if (!resp.ok) {
          var err = await resp.json().catch(function () { return { error: '验证失败' }; });
          loginErr.textContent = err.error || '密码错误';
          loginErr.style.display = '';
          loginBtn.disabled = false;
          loginBtn.textContent = '登 录';
          return;
        }
        // Cookie 已由服务端设置，直接跳转
        location.replace(redirect);
      } catch (e) {
        loginErr.textContent = '网络错误，请重试';
        loginErr.style.display = '';
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });

    loginInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loginBtn.click();
    });

    setTimeout(function () { loginInput.focus(); }, 100);
  })();
  </script>
</body>
</html>
