<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传产出 - 产出导航站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>产出导航站</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/upload.html" class="nav-link active">上传产出</a>
      </nav>
    </div>
  </header>

  <main class="main-container upload-page">
    <!-- 密码验证区域 -->
    <div class="auth-section" id="authSection">
      <div class="auth-card">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h3>需要密码验证</h3>
        <p>请输入上传密码以继续</p>
        <input type="password" class="auth-input" id="authPassword" placeholder="请输入密码" autocomplete="off">
        <button class="btn btn-primary" id="authSubmit">验证</button>
      </div>
    </div>

    <!-- 上传区域 -->
    <div class="upload-section" id="uploadSection" style="display:none;">
      <div class="upload-header">
        <h2>上传产出</h2>
        <p>支持拖拽文件到下方区域，或点击选择文件。允许格式：HTML / 图片 / JSON / 文本 / 代码等</p>
      </div>

      <!-- 拖拽上传区 -->
      <div class="drop-zone" id="dropZone">
        <svg class="drop-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p class="drop-text">拖拽文件到此处</p>
        <p class="drop-hint">支持 HTML / 图片 / JSON / TXT / CSS / JS / MD 等格式</p>
        <p class="drop-hint">或</p>
        <label class="btn btn-outline">
          选择文件
          <input type="file" id="fileInput" accept=".html,.htm,.jpg,.jpeg,.png,.gif,.svg,.webp,.bmp,.ico,.json,.txt,.md,.csv,.xml,.css,.js,.ts,.yaml,.yml,.log,.sql" hidden>
        </label>
      </div>

      <!-- 预览列表 -->
      <div class="file-preview-list" id="filePreviewList"></div>

      <!-- 产出信息表单 -->
      <div class="upload-form" id="uploadForm" style="display:none;">
        <div class="form-group">
          <label for="materialName">产出名称 <span class="required">*</span></label>
          <input type="text" id="materialName" class="form-input" placeholder="如：登录页面模板" maxlength="60">
        </div>
        <div class="form-group">
          <label for="materialTags">标签</label>
          <div class="tag-input-wrapper">
            <div class="tag-list" id="tagList"></div>
            <input type="text" id="tagInput" class="tag-input" placeholder="输入标签后按回车添加" maxlength="20">
          </div>
          <span class="form-hint">按 Enter 添加标签，点击标签上的 × 移除</span>
        </div>
        <div class="form-group">
          <label for="materialDesc">简介（可选）</label>
          <textarea id="materialDesc" class="form-input form-textarea" rows="3" placeholder="简要描述这个产出..." maxlength="200"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="submitUpload" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            确认上传
          </button>
          <button class="btn btn-ghost" id="cancelUpload">取消</button>
        </div>
      </div>

      <!-- 上传进度 -->
      <div class="upload-progress" id="uploadProgress" style="display:none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">上传中...</p>
      </div>

      <!-- 上传成功 -->
      <div class="upload-success" id="uploadSuccess" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h3>上传成功！</h3>
        <p id="successMsg"></p>
        <div class="success-actions">
          <a href="/" class="btn btn-primary">回到首页</a>
          <button class="btn btn-outline" id="uploadAnother">继续上传</button>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/static/app.js"></script>
</body>
</html>
