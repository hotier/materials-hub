<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预览产出 - 产出导航站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="preview-body">
  <header class="preview-header">
    <div class="preview-header-left">
      <span class="preview-title" id="previewTitle">产出预览</span>
      <span class="preview-ext-badge" id="previewExtBadge"></span>
    </div>
    <div class="preview-header-right">
      <a class="btn btn-sm btn-outline" id="btnDownload" title="下载" download>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </a>
    </div>
  </header>

  <!-- 加载中 -->
  <div class="preview-loading" id="previewLoading">
    <div class="spinner"></div>
    <p>加载预览中...</p>
  </div>

  <!-- 错误状态 -->
  <div class="preview-error" id="previewError" style="display:none;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <h3>加载失败</h3>
    <p id="previewErrorMsg">无法加载该产出</p>
  </div>

  <!-- 统一预览：Flyfish File Viewer -->
  <div id="ffViewer" style="flex:1; width:100%; min-height:0; border:none; display:none;"></div>

  <script src="/file-viewer/flyfish-file-viewer-web-full.iife.js"></script>
  <script>
    (async function () {
      const $ = (s) => document.querySelector(s);
      const API_BASE = '/api';

      const id = new URL(location.href).searchParams.get('id');
      const loadingEl = $('#previewLoading');
      const errorEl = $('#previewError');
      const errorMsg = $('#previewErrorMsg');
      const titleEl = $('#previewTitle');
      const extBadge = $('#previewExtBadge');
      const btnDownload = $('#btnDownload');
      const ffViewer = document.getElementById('ffViewer');

      function showError(msg) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'flex';
        errorMsg.textContent = msg || '无法加载该产出';
      }

      if (!id) {
        showError('缺少产出 ID 参数');
        return;
      }

      // Flyfish 在拿到文件信息后再用命令式 mountViewer 挂载（见下方 try 内）

      try {
        const res = await fetch(`${API_BASE}/preview?id=${encodeURIComponent(id)}&info=1`);
        if (res.status === 404) {
          showError('产出不存在或已被删除');
          return;
        }
        if (!res.ok) throw new Error('获取产出信息失败');
        const item = await res.json();

        const ext = (item.ext || '').toLowerCase();
        const name = item.name || item.id;

        // 补上真实扩展名，确保 Flyfish 能从文件名识别类型（item.name 可能不含后缀）
        const viewerName = ext && !name.toLowerCase().endsWith('.' + ext)
          ? name + '.' + ext
          : name;

        titleEl.textContent = name;
        document.title = viewerName;
        if (ext) {
          extBadge.textContent = ext.toUpperCase();
          extBadge.style.display = '';
        }

        btnDownload.href = `${API_BASE}/preview?id=${encodeURIComponent(id)}&download=1`;
        btnDownload.download = name;

        // 统一交给 Flyfish File Viewer 渲染（支持约 200+ 种格式）
        // 用命令式 mountViewer：Web Component 为属性驱动，且返回的句柄通过 .subscribe 暴露状态
        ffViewer.style.display = 'block';
        if (!window.FlyfishFileViewerWebFull || !window.FlyfishFileViewerWebFull.mountViewer) {
          showError('预览组件加载失败');
          return;
        }
        if (window.__ffHandle) { try { window.__ffHandle.destroy(); } catch (e) {} }
        window.__ffHandle = window.FlyfishFileViewerWebFull.mountViewer(ffViewer, {
          url: `${API_BASE}/raw?key=${encodeURIComponent(item.R2Key || '')}`,
          name: viewerName,
          theme: 'light',
          locale: 'zh-CN',
          toolbar: { position: 'bottom-right' },
        });
        const applyState = (state) => {
          if (state && state.error) showError('预览加载失败');
          else if (state && state.ready) loadingEl.style.display = 'none';
        };
        if (typeof window.__ffHandle.subscribe === 'function') {
          window.__ffHandle.subscribe(applyState);
        } else {
          const t = setInterval(() => {
            const st = window.__ffHandle && window.__ffHandle.getState ? window.__ffHandle.getState() : null;
            if (st && (st.error || st.ready)) { clearInterval(t); applyState(st); }
          }, 300);
        }
      } catch (err) {
        showError(err.message || '加载失败');
      }
    })();
  </script>
</body>
</html>
