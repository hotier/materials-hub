<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产出导航站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-body">
  <!-- 顶栏 -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>产出导航站</span>
      </a>
      <div class="header-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索产出名称或标签...">
      </div>
      <div class="header-right">
        <span class="material-count" id="materialCount">--</span>
        <span class="count-label">个产出</span>
        <button class="logout-btn" id="logoutBtn" style="display:none;" title="退出登录">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体：侧边栏 + 内容区 -->
  <div class="app-layout">
    <!-- 左侧边栏：目录树 -->
    <aside class="sidebar" id="sidebar">
      <nav class="dir-tree" id="dirTree">
        <div class="tree-loading">加载中...</div>
      </nav>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content-area" id="contentArea">

    <!-- 加载中（默认隐藏，无缓存时才显示） -->
    <div class="loading" id="loading" style="display:none;">
      <div class="spinner"></div>
      <p>加载产出列表中...</p>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/></svg>
      <h2>还没有产出</h2>
      <p>去<a href="/upload.html">上传面板</a>拖入你的第一个产出吧</p>
    </div>

    <!-- 列表 + 预览 左右分栏 -->
    <div class="workspace" id="workspace" style="display:none;">
      <!-- 产出列表 -->
      <div class="list-panel" id="listPanel">
        <div class="panel-body" id="listTable">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-name">名称</th>
                <th class="col-type" style="width:80px">类型</th>
                <th class="col-desc">简介</th>
                <th class="col-tags">标签</th>
                <th class="col-action" style="width:80px">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 内嵌预览（右侧） -->
      <div class="preview-panel" id="previewPanel">
        <div class="panel-header">
          <span class="panel-title" id="previewPanelTitle">预览</span>
          <span class="preview-ext-badge" id="previewPanelExtBadge" style="display:none;"></span>
          <div class="md-toggle" id="previewPanelMdToggle" style="display:none;">
            <button class="md-toggle-btn active" data-mode="preview">预览</button>
            <button class="md-toggle-btn" data-mode="source">源码</button>
          </div>
          <span style="flex:1;"></span>
          <div class="preview-actions">
            <a class="preview-action-btn" id="previewOpenBtn" href="#" target="_blank" title="新窗口打开">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
            <button class="preview-action-btn" id="previewCloseBtn" title="关闭预览">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-body preview-body" id="previewBody">
          <div class="preview-placeholder" id="previewPlaceholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <p>点击列表中的产出查看预览</p>
          </div>
          <div id="ffViewer" style="position:absolute; inset:0; display:none;"></div>
          <iframe class="preview-frame" id="previewFrame" style="display:none;"></iframe>
          <div class="preview-img" id="previewImg" style="display:none;">
            <img id="previewImgContent" src="" alt="预览图片">
          </div>
          <pre class="preview-code" id="previewCode" style="display:none;"><code id="previewCodeContent"></code></pre>
          <div class="preview-md" id="previewMd" style="display:none;">
            <div class="preview-md-body markdown-body" id="previewMdContent"></div>
            <pre class="preview-md-source" id="previewMdSource" style="display:none;"><code id="previewMdSourceCode"></code></pre>
          </div>
        </div>
      </div>
    </div>
  </main>
  </div>

  <!-- 浮动上传按钮 -->
  <a href="/upload.html" class="fab" title="上传产出" aria-label="上传产出">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </a>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="editModal" style="display:none;">
    <div class="modal">
      <h3>编辑产出</h3>
      <div class="modal-field">
        <label for="editName">名称</label>
        <div class="input-with-suffix">
          <input type="text" class="modal-input" id="editName" placeholder="请输入名称" maxlength="200" />
          <span class="input-suffix" id="editExt"></span>
        </div>
      </div>
      <div class="modal-field">
        <label for="editDesc">描述</label>
        <textarea class="modal-input modal-textarea" id="editDesc" placeholder="添加描述（可选）" rows="3"></textarea>
      </div>
      <div class="modal-field">
        <label for="editTags">标签</label>
        <input type="text" class="modal-input" id="editTags" placeholder="多个标签用逗号分隔" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelEdit">取消</button>
        <button class="btn btn-primary" id="confirmEdit">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal" style="display:none;">
    <div class="modal">
      <h3>确认删除</h3>
      <p>确定要删除产出 "<span id="deleteItemName"></span>" 吗？此操作不可撤销。</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelDelete">取消</button>
        <button class="btn btn-danger" id="confirmDelete">确认删除</button>
      </div>
    </div>
  </div>

  <script src="/file-viewer/flyfish-file-viewer-web-full.iife.js"></script>
  <script src="/static/storage.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
