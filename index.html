<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产出导航站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 顶栏 -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>产出导航站</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link active">首页</a>
        <a href="/upload.html" class="nav-link">上传产出</a>
      </nav>
      <div class="header-right">
        <span class="material-count" id="materialCount">--</span>
        <span class="count-label">个产出</span>
        <button class="logout-btn" id="logoutBtn" style="display:none;" title="退出登录">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体 -->
  <main class="main-container">
    <!-- 搜索 & 筛选栏 -->
    <section class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索产出名称或标签...">
      </div>
      <div class="tag-filter" id="tagFilter"></div>
    </section>

    <!-- 加载中 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>加载产出列表中...</p>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      </svg>
      <h2>还没有产出</h2>
      <p>去<a href="/upload.html">上传面板</a>拖入你的第一个产出吧（支持 HTML / 图片 / JSON / 文本 / 代码等）</p>
    </div>

    <!-- 卡片网格 -->
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal" style="display:none;">
    <div class="modal">
      <h3>确认删除</h3>
      <p>确定要删除产出 "<span id="deleteItemName"></span>" 吗？此操作不可撤销。</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelDelete">取消</button>
        <button class="btn btn-danger" id="confirmDelete">确认删除</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
