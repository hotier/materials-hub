name = "material-hub"
compatibility_date = "2026-07-29"
pages_build_output_dir = "."

# R2 存储桶绑定（替换为你的桶名）
[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "material-hub"

# KV 命名空间绑定（替换为你的 KV ID）
[[kv_namespaces]]
binding = "MATERIALS_KV"
id = "your-kv-namespace-id"

# 上传文件大小限制（最大 10MB）
[limits]
body_size = "10MB"

# 环境变量（本地开发请编辑 .dev.vars）
[vars]
# 上线前用 wrangler secret put 设置：
#   npx wrangler secret put LOGIN_TOKEN
#   npx wrangler secret put SYNC_TOKEN

# 本地开发
[dev]
port = 8787
