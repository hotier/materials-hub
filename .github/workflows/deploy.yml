name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]          # 推送 main 即自动部署到生产环境
  workflow_dispatch:          # 也支持在 Actions 页面手动触发

# 防止多次推送时并发部署互相覆盖（保留最新一次）
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read              # 只需要读取仓库内容

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER: npx wrangler@4.114.0   # 固定版本，规避新版本 API 变更导致流水线突然失效
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 提前发现类型错误（含 r2/R2、kv/KV 等变量改名回归）
      - name: Typecheck (Server)
        run: npm run typecheck

      - name: Typecheck (Frontend)
        run: npm run typecheck:fe

      - name: Build
        run: npm run build

      # 校验 Cloudflare 凭据是否有效，避免后续步骤静默失败
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: ${{ env.WRANGLER }} whoami

      # ---------- R2 存储桶（幂等：已存在则跳过） ----------
      # 注意：Pages Functions 的资源绑定由 wrangler.toml 统一管理，
      # wrangler pages deploy 会读取其中的 [[r2_buckets]] / [[kv_namespaces]]。
      - name: Ensure R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          BUCKET="material-hub"
          # wrangler 会在 stdout 打印版本/废弃警告，提取首个 JSON 部分再判断
          extract_json() { printf '%s\n' "$1" | sed -n '/^[\[{]/,$p'; }
          RAW=$(${{ env.WRANGLER }} r2 bucket list --json 2>/dev/null)
          LIST=$(extract_json "$RAW")
          if echo "$LIST" | jq -e --arg n "$BUCKET" '.[]? | select(.name==$n)' >/dev/null 2>&1; then
            echo "R2 bucket '$BUCKET' already exists."
          else
            echo "Creating R2 bucket '$BUCKET'..."
            OUT=$(${{ env.WRANGLER }} r2 bucket create "$BUCKET" 2>&1) || {
              if echo "$OUT" | grep -qi "already exists"; then
                echo "R2 bucket '$BUCKET' already exists; continuing."
              else
                echo "$OUT"; exit 1
              fi
            }
          fi

      # ---------- KV 命名空间（幂等：已存在则复用其 ID） ----------
      # wrangler v4 的 kv namespace 子命令不支持 --json，改用 Cloudflare REST API 直调，
      # 输出为标准 JSON，jq 直接取 .result[].id，无需解析 wrangler 命令行输出。
      - name: Ensure KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          TITLE="material-hub"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          # 查询已有命名空间
          RESP=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          KV_ID=$(echo "$RESP" | jq -r --arg t "$TITLE" '.result[]? | select(.title==$t) | .id' | head -n1)
          if [ -n "$KV_ID" ]; then
            echo "KV namespace '$TITLE' already exists: $KV_ID"
          else
            echo "Creating KV namespace '$TITLE'..."
            RESP=$(curl -sf -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"$TITLE\"}" \
              "$API")
            KV_ID=$(echo "$RESP" | jq -r '.result.id')
            if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
              echo "::error::Failed to create KV namespace. API response:"
              echo "$RESP"
              exit 1
            fi
          fi
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"

      # ---------- 将真实的 KV ID 注入 wrangler.toml ----------
      # wrangler.toml 中占位符为 your-kv-namespace-id，
      # 部署时替换为真实命名空间 ID，使 Pages 的 KV 绑定（c.env.KV）生效。
      - name: Inject KV id into wrangler.toml
        env:
          KV_ID: ${{ steps.kv.outputs.kv_id }}
        run: |
          if [ -z "$KV_ID" ]; then
            echo "::error::KV namespace id is empty"; exit 1
          fi
          sed -i "s/your-kv-namespace-id/$KV_ID/" wrangler.toml
          if grep -q "your-kv-namespace-id" wrangler.toml; then
            echo "::error::KV id was not substituted"; exit 1
          fi
          echo "Injected KV id: $KV_ID"

      # ---------- 确保 Pages 项目存在（首次部署时创建，幂等） ----------
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          NAME="material-hub"
          echo "Ensuring Pages project '$NAME'..."
          OUT=$(${{ env.WRANGLER }} pages project create "$NAME" --production-branch main 2>&1) || {
            if echo "$OUT" | grep -qi "already exists"; then
              echo "Pages project '$NAME' already exists; continuing."
            else
              echo "$OUT"; exit 1
            fi
          }

      # ---------- 设置 Pages 密钥（从 GitHub Secrets 注入，限定 production 环境） ----------
      # 注意：代码实际读取的是 LOGIN_TOKEN 与 SYNC_TOKEN
      # （README 中的 UPLOAD_PASSWORD 已过时，此处按代码为准）。
      - name: Set Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.CF_LOGIN_TOKEN }}" ]; then
            echo -n "${{ secrets.CF_LOGIN_TOKEN }}" \
              | ${{ env.WRANGLER }} pages secret put LOGIN_TOKEN --project-name material-hub --env production
          fi
          if [ -n "${{ secrets.CF_SYNC_TOKEN }}" ]; then
            echo -n "${{ secrets.CF_SYNC_TOKEN }}" \
              | ${{ env.WRANGLER }} pages secret put SYNC_TOKEN --project-name material-hub --env production
          fi

      # ---------- 部署到 Cloudflare Pages（默认部署到生产环境） ----------
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: ${{ env.WRANGLER }} pages deploy --project-name material-hub
